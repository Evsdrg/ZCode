[package]
name = "cua-linux-helper"
version = "0.1.0"
edition = "2021"

[dependencies]
atspi = { version = "0.30.0", default-features = false, features = ["connection", "proxies", "tokio"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
